<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPass - Browse Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar-custom">
        <div style="display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;">
            <a href="dashboard.html" class="navbar-brand">🎟️ EventPass</a>
            <div style="display:flex;align-items:center;gap:14px;">
                <span class="wallet-pill">₹ <span id="walletBalance">0</span></span>
                <button onclick="rechargePrompt()" class="btn-secondary-custom" style="padding:6px 14px;">+ Add Money</button>
                <span class="text-white" id="welcomeUser" style="font-size:0.9rem;"></span>
                <button onclick="logout()" class="btn-danger-custom">Logout</button>
            </div>
        </div>
    </nav>

    <div style="max-width:1200px;margin:24px auto;padding:0 20px;">
        <div class="tab-bar">
            <button class="active" data-tab="browse" onclick="switchTab('browse')">🎪 Browse Events</button>
            <button data-tab="bookings" onclick="switchTab('bookings')">🎫 My Bookings</button>
        </div>

        <!-- Browse tab -->
        <div id="browseTab">
            <div id="recommendedSection" style="display:none;margin-bottom:22px;">
                <h3 style="margin:0 0 10px 0;">✨ Recommended for you</h3>
                <div id="recommendedStrip" style="display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;"></div>
            </div>
            <h3 style="margin:0 0 10px 0;">📅 Upcoming events</h3>
            <div id="categoryPills" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;"></div>
            <div style="margin-bottom:18px;">
                <input id="searchBox" class="form-control" style="max-width:340px;" placeholder="Search by title or venue..." oninput="renderEvents()">
            </div>
            <div id="eventGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
        </div>

        <!-- Bookings tab -->
        <div id="bookingsTab" style="display:none;">
            <div class="card">
                <h3 style="margin-top:0;">Your Bookings</h3>
                <div id="bookingsList"></div>
            </div>
        </div>
    </div>

    <!-- Booking modal -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Book Tickets</h3>
            <div id="modalEventInfo" style="margin-bottom:18px;"></div>
            <div style="margin-bottom:18px;">
                <label class="text-muted" style="font-size:0.85rem;font-weight:600;">NUMBER OF TICKETS</label>
                <input id="qtyInput" type="number" class="form-control" min="1" value="1">
            </div>
            <div id="modalPrice" style="margin-bottom:18px;font-weight:600;font-size:1.1rem;"></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn-secondary-custom" onclick="closeBookingModal()">Cancel</button>
                <button class="btn-primary-custom" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- Ticket modal -->
    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content" style="text-align:center;max-width:560px;">
            <h3 style="margin-top:0;color:var(--primary);">🎫 Booking Confirmed!</h3>
            <div id="ticketDetails" style="margin-bottom:18px;"></div>
            <div id="ticketQrList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:10px;"></div>
            <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
                <button class="btn-primary-custom" onclick="closeTicketModal()">Done</button>
            </div>
        </div>
    </div>

    <!-- Wallet recharge modal -->
    <div id="rechargeModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">💰 Add Money</h3>
            <div style="margin-bottom:14px;">
                <label class="text-muted" style="font-size:0.85rem;font-weight:600;">AMOUNT (₹)</label>
                <input id="rechargeAmount" type="number" class="form-control" min="1" value="500">
            </div>
            <div id="razorpayRow" style="display:none;margin-bottom:10px;">
                <button class="btn-primary-custom" style="width:100%;" onclick="payWithRazorpay()">Pay with Razorpay (UPI / card)</button>
            </div>
            <button class="btn-secondary-custom" style="width:100%;" onclick="demoTopUp()">Instant demo top-up</button>
            <div style="margin-top:16px;">
                <h4 style="margin:0 0 8px 0;">Recent top-ups</h4>
                <div id="topupHistory" class="text-muted" style="font-size:0.85rem;">—</div>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:14px;">
                <button class="btn-secondary-custom" onclick="closeRechargeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
