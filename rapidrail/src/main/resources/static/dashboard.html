<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPass - Browse Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar-custom">
        <div style="display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;">
            <a href="dashboard.html" class="navbar-brand">🎟️ EventPass</a>
            <div style="display:flex;align-items:center;gap:14px;">
                <span class="wallet-pill">₹ <span id="walletBalance">0</span></span>
                <button onclick="rechargePrompt()" class="btn-secondary-custom" style="padding:6px 14px;">+ Add Money</button>
                <span class="text-white" id="welcomeUser" style="font-size:0.9rem;"></span>
                <button onclick="logout()" class="btn-danger-custom">Logout</button>
            </div>
        </div>
    </nav>

    <div style="max-width:1200px;margin:24px auto;padding:0 20px;">
        <div class="tab-bar">
            <button class="active" data-tab="browse" onclick="switchTab('browse')">🎪 Browse Events</button>
            <button data-tab="bookings" onclick="switchTab('bookings')">🎫 My Bookings</button>
        </div>

        <!-- Browse tab -->
        <div id="browseTab">
            <div style="display:flex;gap:12px;align-items:end;margin-bottom:18px;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;">
                    <label class="text-muted" style="font-size:0.8rem;font-weight:600;">SEARCH</label>
                    <input id="searchBox" class="form-control" placeholder="Search by title or venue..." oninput="renderEvents()">
                </div>
                <div style="min-width:160px;">
                    <label class="text-muted" style="font-size:0.8rem;font-weight:600;">CATEGORY</label>
                    <select id="categoryFilter" class="form-select" onchange="renderEvents()">
                        <option value="">All</option>
                        <option value="Concert">Concert</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div id="eventGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
        </div>

        <!-- Bookings tab -->
        <div id="bookingsTab" style="display:none;">
            <div class="card">
                <h3 style="margin-top:0;">Your Bookings</h3>
                <div id="bookingsList"></div>
            </div>
        </div>
    </div>

    <!-- Booking modal -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Book Tickets</h3>
            <div id="modalEventInfo" style="margin-bottom:18px;"></div>
            <div style="margin-bottom:18px;">
                <label class="text-muted" style="font-size:0.85rem;font-weight:600;">NUMBER OF TICKETS</label>
                <input id="qtyInput" type="number" class="form-control" min="1" value="1">
            </div>
            <div id="modalPrice" style="margin-bottom:18px;font-weight:600;font-size:1.1rem;"></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn-secondary-custom" onclick="closeBookingModal()">Cancel</button>
                <button class="btn-primary-custom" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- Ticket modal -->
    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content" style="text-align:center;max-width:560px;">
            <h3 style="margin-top:0;color:var(--primary);">🎫 Booking Confirmed!</h3>
            <div id="ticketDetails" style="margin-bottom:18px;"></div>
            <div id="ticketQrList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:10px;"></div>
            <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
                <button class="btn-primary-custom" onclick="closeTicketModal()">Done</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
