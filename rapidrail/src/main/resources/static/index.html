<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPass - Local Event Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-hero">
            <h1>Event<em>Pass</em></h1>
            <p>Concerts, workshops, seminars and more around you. Book in seconds, walk in with a QR scan.</p>
            <div class="poster-row">
                <img src="https://picsum.photos/seed/eventpass-monsoon-beats/300/200" alt="Concert" loading="lazy">
                <img src="https://picsum.photos/seed/eventpass-pottery-workshop/300/200" alt="Workshop" loading="lazy">
                <img src="https://picsum.photos/seed/eventpass-comedy-open-mic/300/200" alt="Comedy night" loading="lazy">
            </div>
        </div>
        <div class="auth-form">
            <div class="card">
                <div id="registerSection">
                    <h3 style="margin-top:0;">Create account</h3>
                    <p class="text-muted" style="font-size:0.85rem;margin-top:-4px;">Get a ₹500 wallet bonus on signup.</p>
                    <form id="registerForm">
                        <div style="margin-bottom:14px;">
                            <label class="text-muted" style="font-size:0.8rem;font-weight:600;">USERNAME</label>
                            <input type="text" id="regUser" class="form-control" required autocomplete="username">
                        </div>
                        <div style="margin-bottom:14px;">
                            <label class="text-muted" style="font-size:0.8rem;font-weight:600;">EMAIL</label>
                            <input type="email" id="regEmail" class="form-control" required autocomplete="email">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label class="text-muted" style="font-size:0.8rem;font-weight:600;">PASSWORD</label>
                            <input type="password" id="regPass" class="form-control" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn-primary-custom" style="width:100%;">Create Account</button>
                    </form>
                    <p style="text-align:center;margin-top:18px;color:var(--muted);font-size:0.9rem;">
                        Already have an account? <a href="#" onclick="toggleAuth();return false;" style="color:var(--accent);font-weight:600;text-decoration:none;">Sign in</a>
                    </p>
                </div>

                <div id="loginSection" style="display:none;">
                    <h3 style="margin-top:0;">Sign in</h3>
                    <form id="loginForm">
                        <div style="margin-bottom:14px;">
                            <label class="text-muted" style="font-size:0.8rem;font-weight:600;">USERNAME</label>
                            <input type="text" id="loginUser" class="form-control" required autocomplete="username">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label class="text-muted" style="font-size:0.8rem;font-weight:600;">PASSWORD</label>
                            <input type="password" id="loginPass" class="form-control" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-primary-custom" style="width:100%;">Sign In</button>
                    </form>
                    <p style="text-align:center;margin-top:18px;color:var(--muted);font-size:0.9rem;">
                        No account? <a href="#" onclick="toggleAuth();return false;" style="color:var(--accent);font-weight:600;text-decoration:none;">Create one</a>
                    </p>
                </div>

                <div style="text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--border);">
                    <a href="organizer.html" style="color:var(--muted);font-size:0.85rem;text-decoration:none;">Organizer Panel</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
