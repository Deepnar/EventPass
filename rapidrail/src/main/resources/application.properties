# =====================================================
# EventPass - Local Event Ticket Booking + QR Entry Validation
# =====================================================
#
#  COLLEGE LAPTOP (Windows + MySQL Workbench):
#  Only change the TWO lines below:
#    1. spring.datasource.url         (port + db name)
#    2. spring.datasource.password    (your MySQL Workbench password)
#  Leave everything else as-is.
# =====================================================

# ---- Server ----
server.port=8081

# ---- Database (MySQL 8) ----
# Local default: MySQL on localhost:3306, database auto-created.
# For MySQL Workbench installs the defaults below are usually right
# except for the password, which you set during MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/eventpass?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# No default: must come from the DB_PASSWORD env var (see start.sh / README).
# Fails fast at boot if unset, instead of silently using a wrong password.
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate (classes become tables) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Jackson date format ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Razorpay (wallet top-ups, test mode) ----
# Empty by default: checkout stays disabled until you add keys (see README).
# Get free test keys at https://dashboard.razorpay.com (Settings → API Keys).
#   export RAZORPAY_KEY_ID='rzp_test_...'
#   export RAZORPAY_KEY_SECRET='...'
# or put them in rapidrail/.env (gitignored, never committed).
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
