# Test profile: isolated H2 in-memory DB (MySQL stays the runtime DB)
spring.datasource.url=jdbc:h2:mem:eventpass_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Dummy Razorpay test keys (signature math only; no network calls in tests)
razorpay.key-id=test_key_id
razorpay.key-secret=test_secret_123
